<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI APP — Guida Rapida PP Cremona</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0f1115;color:#e2e8f0;font-family:'Barlow',sans-serif;min-height:100vh;}
.header{text-align:center;padding:24px 16px 16px;border-bottom:1px solid rgba(255,255,255,0.08);}
.header .icon{font-size:40px;margin-bottom:4px;}
.header h1{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;color:#f5a623;}
.header .sub{font-size:11px;letter-spacing:1.5px;color:rgba(255,255,255,0.4);text-transform:uppercase;margin-top:2px;}

.wrap{max-width:700px;margin:0 auto;padding:16px;}

.search-box{width:100%;padding:12px 16px;background:#16213e;border:1px solid rgba(255,255,255,0.15);border-radius:12px;color:#e2e8f0;font-family:'Barlow',sans-serif;font-size:14px;margin-bottom:14px;}
.search-box:focus{outline:none;border-color:#f5a623;}

.filtri{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.filtro-chip{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);padding:7px 14px;border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap;}
.filtro-chip.active{background:rgba(245,166,35,0.15);border-color:#f5a623;color:#f5a623;font-weight:600;}

.app-section{margin-bottom:22px;}
.app-section-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px;color:#f5a623;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(245,166,35,0.2);}

.faq-item{background:#16213e;border:1px solid rgba(255,255,255,0.08);border-radius:10px;margin-bottom:8px;overflow:hidden;}
.faq-domanda{padding:13px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;color:#e2e8f0;}
.faq-domanda .segno{color:#f5a623;font-size:18px;flex-shrink:0;margin-left:10px;transition:transform 0.2s;}
.faq-item.open .segno{transform:rotate(45deg);}
.faq-risposta{max-height:0;overflow:hidden;transition:max-height 0.25s ease;}
.faq-item.open .faq-risposta{max-height:500px;}
.faq-risposta-inner{padding:0 16px 14px;font-size:13px;line-height:1.7;color:rgba(255,255,255,0.75);white-space:pre-wrap;}
.faq-risposta-inner strong{color:#f5a623;}

.no-risultati{text-align:center;padding:30px;color:rgba(255,255,255,0.4);font-size:13px;}

#modalLoginGoogle{display:flex;position:fixed;inset:0;z-index:99999;background:rgba(13,27,42,0.97);align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center;}
#modalLoginGoogle .icon{font-size:40px;margin-bottom:12px;}
#modalLoginGoogle h2{color:#f5a623;font-family:Arial,sans-serif;font-size:20px;margin-bottom:8px;}
#modalLoginGoogle p{color:#ccc;font-size:13px;max-width:320px;margin-bottom:20px;}
#loginGoogleErrore{color:#ff6b6b;font-size:12px;margin-top:16px;max-width:300px;}
</style>
</head>
<body>

<!-- MODAL LOGIN GOOGLE -->
<div id="modalLoginGoogle">
  <div class="icon">🔒</div>
  <h2>Accesso riservato</h2>
  <p>Accedi con un account Google autorizzato per usare AI APP.</p>
  <div id="googleSignInButton"></div>
  <p id="loginGoogleErrore"></p>
</div>

<div class="header">
  <div class="icon">📖</div>
  <h1>AI APP</h1>
  <div class="sub">Guida rapida — Polizia Provinciale di Cremona</div>
</div>

<div class="wrap">
  <input type="text" class="search-box" id="ricerca" placeholder="🔍 Cerca una domanda..." oninput="filtra()">

  <div class="filtri" id="filtri"></div>

  <div id="contenutoFaq"></div>
  <div class="no-risultati" id="nessunRisultato" style="display:none;">Nessuna domanda trovata. Prova a cercare con altre parole.</div>
</div>

<script>
var idTokenCorrente = null;
var CORVIDI_URL_GS = 'https://script.google.com/macros/s/AKfycbxL49RBHln0W11KTM90AeJblxpsu4vigg7H_mnzKBw4tdLEfS1wIWkCR4LU9AOStOpIJQ/exec';

function salvaTokenCondiviso(token) {
  try {
    localStorage.setItem('pp_shared_idtoken', token);
    localStorage.setItem('pp_shared_idtoken_scadenza', String(Date.now() + 55*60*1000));
  } catch(e) {}
}
function leggiTokenCondiviso() {
  try {
    var token = localStorage.getItem('pp_shared_idtoken');
    var scadenza = parseInt(localStorage.getItem('pp_shared_idtoken_scadenza') || '0');
    if (token && Date.now() < scadenza) return token;
  } catch(e) {}
  return null;
}
function handleGoogleCredentialResponse(response) {
  idTokenCorrente = response.credential;
  fetch(CORVIDI_URL_GS + '?action=verificaLogin&idToken=' + encodeURIComponent(idTokenCorrente))
    .then(function(r){ return r.json(); })
    .then(function(verifica){
      if (verifica.ok) {
        salvaTokenCondiviso(idTokenCorrente);
        document.getElementById('modalLoginGoogle').style.display = 'none';
      } else {
        document.getElementById('loginGoogleErrore').textContent = '❌ ' + verifica.message;
        idTokenCorrente = null;
      }
    })
    .catch(function(){
      document.getElementById('loginGoogleErrore').textContent = '❌ Errore di verifica, riprova.';
    });
}
function inizializzaBottoneGoogle(){
  if (window.google && google.accounts && google.accounts.id) {
    google.accounts.id.initialize({
      client_id: '226909521211-tk40j8dfcr6dr428uqb4sd4s2lt5qbi6.apps.googleusercontent.com',
      callback: handleGoogleCredentialResponse,
      auto_select: true
    });
    google.accounts.id.renderButton(
      document.getElementById('googleSignInButton'),
      { theme: 'outline', size: 'large', text: 'signin_with', width: 280 }
    );
    google.accounts.id.prompt();
    setInterval(function(){ try { google.accounts.id.prompt(); } catch(e) {} }, 45 * 60 * 1000);
  }
}
window.onload = function(){
  var tokenCondiviso = leggiTokenCondiviso();
  if (tokenCondiviso) {
    idTokenCorrente = tokenCondiviso;
    fetch(CORVIDI_URL_GS + '?action=verificaLogin&idToken=' + encodeURIComponent(tokenCondiviso))
      .then(function(r){ return r.json(); })
      .then(function(verifica){
        if (verifica.ok) {
          document.getElementById('modalLoginGoogle').style.display = 'none';
        } else {
          idTokenCorrente = null;
          inizializzaBottoneGoogle();
        }
      })
      .catch(function(){ inizializzaBottoneGoogle(); });
  } else {
    inizializzaBottoneGoogle();
  }
  renderFaq();
};

// ============================================================
// CONTENUTO GUIDA — organizzato per app, solo uso pratico
// ============================================================
var FAQ = [
  { app: 'Selvatici — CRAS', domande: [
    { q: 'Come registro un intervento CRAS?', a: 'Apri Selvatici, tocca CRAS, seleziona l\'agente e compila animale e ore. Scrivi Via e Comune di residenza del consegnante, poi il Luogo del ritrovamento. Indica chi ha consegnato e il cellulare, poi scegli l\'esito: Consegnato al CRAS (scegliendo il centro) oppure Liberato. Infine tocca Salva bozza (se sei sul campo) o Stampa e registra (se hai la stampante).' },
    { q: 'Cosa faccio se il ritrovamento è nello stesso posto della residenza?', a: 'Spunta "Il ritrovamento coincide con la residenza": il campo Luogo del ritrovamento si compila da solo copiando Via e Comune, e resta bloccato in scrittura finché non togli la spunta.' },
    { q: 'Cosa faccio se l\'animale viene consegnato direttamente al Comando?', a: 'Spunta "Consegnato direttamente al Comando dall\'utente": il campo Luogo del ritrovamento si riempie da solo con la dicitura corretta.' },
    { q: 'Quale centro CRAS scelgo se non sono sicuro?', a: 'Usa il bottone generico "CRAS" invece di Loghino Bosco o Parcobaleno. Più tardi, quando sai il centro esatto, puoi correggerlo con "Ristampa schede di oggi".' }
  ]},
  { app: 'Selvatici — IZP', domande: [
    { q: 'Come registro una consegna IZP (Zooprofilassi)?', a: 'Apri Selvatici, tocca IZP/Zooprofilassi, compila tipo animale, causa morte, tipo consegna (Carcassa o Campioni), via e comune del ritrovamento e chi ha consegnato. Poi Salva bozza o Stampa e registra.' },
    { q: 'Quando devo compilare il Numero identificativo?', a: 'È obbligatorio quando l\'animale è un CINGHIALE, per la sorveglianza della peste suina africana. Per le altre specie puoi lasciarlo vuoto.' }
  ]},
  { app: 'Selvatici — Funzioni comuni', domande: [
    { q: 'Come funzionano le bozze?', a: 'Sul campo, se non hai tempo o stampante, tocca "Salva bozza" invece di "Stampa e registra". La bozza resta in attesa in "Bozze da stampare" (con un numero rosso che mostra quante ce ne sono). In ufficio apri quella sezione e tocca "Stampa e registra tutte le bozze": esce un unico PDF con tutti i verbali pronti, e i dati vengono salvati in automatico.' },
    { q: 'Come correggo una pratica già registrata oggi?', a: 'Dalla home tocca "🖨️ Ristampa schede di oggi", scegli CRAS o IZP, trova la pratica e tocca "Correggi e ristampa". Puoi modificare qualsiasi campo tranne il numero di pratica. Al salvataggio il verbale si ristampa con i dati corretti. Funziona solo per le pratiche di oggi.' },
    { q: 'Come funziona la modalità prova?', a: 'Utile per allenarti senza rovinare la numerazione ufficiale. Tocca "🧪 Attiva modalità prova" in home (appare un banner arancione). Le pratiche create avranno "PROVA" al posto del numero e saranno ristampabili solo nei primi 10 minuti. Ricordati di disattivarla prima di riprendere il lavoro vero.' },
    { q: 'Devo scrivere in maiuscolo?', a: 'No, non serve — qualsiasi cosa scrivi viene salvata automaticamente in maiuscolo nel foglio.' },
    { q: 'Come scarico il PDF del verbale?', a: 'Dopo aver stampato, nella finestra che si apre tocca "⬇️ Scarica PDF": il file scende direttamente nella cartella Download del tuo dispositivo, senza passare dalla finestra di stampa del browser.' }
  ]},
  { app: 'Corvidi', domande: [
    { q: 'Come registro un intervento di controllo corvidi?', a: 'Apri Corvidi, compila i dati dell\'intervento (specie, quantità, luogo) e i dati CF/Email se richiesti, poi salva. Le statistiche per specie si aggiornano da sole.' }
  ]},
  { app: 'Flotta', domande: [
    { q: 'Come registro un rifornimento o dei chilometri?', a: 'Apri Flotta, scegli il veicolo (targa) e l\'autista, poi inserisci chilometri o dati del rifornimento. Per i decimali puoi scrivere sia la virgola che il punto, l\'app li riconosce entrambi.' },
    { q: 'Come stampo un documento della Flotta?', a: 'Usa l\'app dedicata "Stampa Flotta", separata dal registro principale.' }
  ]},
  { app: 'Piccioni', domande: [
    { q: 'Come registro un censimento o abbattimento?', a: 'Apri Piccioni, seleziona Comune/Azienda, compila i dati richiesti (numero capi, cacciatore con CF/Email per l\'esenzione tassa regionale) e salva.' }
  ]},
  { app: 'Servizio', domande: [
    { q: 'Come registro il servizio giornaliero?', a: 'Apri Servizio e compila i dati della giornata come richiesto dal modulo.' }
  ]},
  { app: 'Turni', domande: [
    { q: 'Come vedo i turni del mese?', a: 'Apri Turni, tab Calendario per il mese in corso, tab Archivio per i mesi passati.' },
    { q: 'Cos\'è la sezione ART.24?', a: 'Analizza automaticamente se un agente ha lavorato un\'intera settimana senza godere del riposo (turno "R") — in quel caso spetta la maggiorazione del 50% prevista dall\'Art.24 del CCNL. Tocca "Carica analisi" per vedere i casi, ed eventualmente "Scrivi tabella nel foglio" o "Scrivi nota ART.24 sui turni" per registrarlo.' }
  ]},
  { app: 'Portale e Reset', domande: [
    { q: 'A cosa serve il Portale?', a: 'È la pagina centrale con l\'elenco di tutte le app: da lì puoi raggiungerle tutte con un tocco.' },
    { q: 'A cosa serve Reset?', a: 'Pulisce i dati salvati sul tuo dispositivo (utile se cambi telefono o hai problemi). È libera, non richiede login, perché non gestisce dati sensibili.' }
  ]}
];

function renderFiltri(){
  var html = '<div class="filtro-chip active" onclick="selezionaFiltro(this,\'tutti\')">Tutte le app</div>';
  FAQ.forEach(function(sezione){
    html += '<div class="filtro-chip" onclick="selezionaFiltro(this,\''+sezione.app+'\')">'+sezione.app+'</div>';
  });
  document.getElementById('filtri').innerHTML = html;
}

var filtroAttivo = 'tutti';

function selezionaFiltro(el, app){
  filtroAttivo = app;
  document.querySelectorAll('.filtro-chip').forEach(function(c){ c.className = 'filtro-chip'; });
  el.className = 'filtro-chip active';
  renderFaq();
}

function toggleFaq(id){
  var el = document.getElementById(id);
  el.classList.toggle('open');
}

function renderFaq(){
  var query = (document.getElementById('ricerca').value || '').toLowerCase().trim();
  var html = '';
  var trovatoQualcosa = false;
  var contatore = 0;

  FAQ.forEach(function(sezione){
    if(filtroAttivo !== 'tutti' && sezione.app !== filtroAttivo) return;

    var domandeFiltrate = sezione.domande.filter(function(d){
      if(!query) return true;
      return (d.q + ' ' + d.a).toLowerCase().indexOf(query) >= 0;
    });
    if(domandeFiltrate.length === 0) return;

    trovatoQualcosa = true;
    html += '<div class="app-section"><div class="app-section-title">'+sezione.app+'</div>';
    domandeFiltrate.forEach(function(d){
      contatore++;
      var id = 'faq'+contatore;
      html += '<div class="faq-item" id="'+id+'">'+
        '<div class="faq-domanda" onclick="toggleFaq(\''+id+'\')">'+d.q+'<span class="segno">+</span></div>'+
        '<div class="faq-risposta"><div class="faq-risposta-inner">'+d.a+'</div></div>'+
      '</div>';
    });
    html += '</div>';
  });

  document.getElementById('contenutoFaq').innerHTML = html;
  document.getElementById('nessunRisultato').style.display = trovatoQualcosa ? 'none' : 'block';
}

function filtra(){ renderFaq(); }

renderFiltri();
</script>
</body>
</html>
